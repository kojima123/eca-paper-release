<!doctype html><html><head><meta charset="utf-8"><title>Cover</title><style>
html,body{margin:0;background:#fff} body{width:1200px;height:630px;font-family:Georgia,serif;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-size:46px;margin:0 0 6px} p{font-size:24px;color:#555;margin:0 0 26px;font-style:italic} .d{width:1040px}
</style></head><body><h1>When Can an Agent Act Without Thinking?</h1><p>Execution contracts and stop-record diagnostics for an LLM agent on ARC-AGI-3</p><div class="d"><svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" font-size="12" role="img" aria-label="The execution contract">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect x="10" y="20" width="200" height="62" rx="6" fill="#eaf2fc" stroke="#2a78d6"/>
  <text x="110" y="42" text-anchor="middle" font-weight="bold">Instance replay (library)</text>
  <text x="110" y="60" text-anchor="middle" font-size="10.5">exact replay of past successes,</text>
  <text x="110" y="74" text-anchor="middle" font-size="10.5">keyed on the start frame's hash</text>
  <rect x="10" y="100" width="200" height="62" rx="6" fill="#eaf2fc" stroke="#2a78d6"/>
  <text x="110" y="122" text-anchor="middle" font-weight="bold">Mechanic families</text>
  <text x="110" y="140" text-anchor="middle" font-size="10.5">15 pre-authored models, certified</text>
  <text x="110" y="154" text-anchor="middle" font-size="10.5">when closed on the level's evidence</text>
  <rect x="262" y="45" width="176" height="92" rx="6" fill="#f6f5f1" stroke="#555"/>
  <text x="350" y="66" text-anchor="middle" font-weight="bold">Gate (one contract)</text>
  <text x="350" y="85" text-anchor="middle" font-size="10.5">grant: certificate</text>
  <text x="350" y="100" text-anchor="middle" font-size="10.5">check: frame after every action</text>
  <text x="350" y="115" text-anchor="middle" font-size="10.5">revoke: first mismatch</text>
  <text x="350" y="130" text-anchor="middle" font-size="10.5">hand back: where, what, why</text>
  <rect x="490" y="45" width="200" height="92" rx="6" fill="#fdeee7" stroke="#eb6834"/>
  <text x="590" y="70" text-anchor="middle" font-weight="bold">LLM (supervisor)</text>
  <text x="590" y="90" text-anchor="middle" font-size="10.5">acts on novelty and after</text>
  <text x="590" y="104" text-anchor="middle" font-size="10.5">a routine's prediction fails;</text>
  <text x="590" y="118" text-anchor="middle" font-size="10.5">writes Python that calls action()</text>
  <rect x="262" y="185" width="176" height="44" rx="6" fill="#fff" stroke="#555"/>
  <text x="350" y="205" text-anchor="middle" font-weight="bold">Game (ARC-AGI-3)</text>
  <text x="350" y="220" text-anchor="middle" font-size="10.5">deterministic; frames observed</text>
  <line x1="210" y1="51" x2="260" y2="80" stroke="#333" marker-end="url(#ar)"/>
  <line x1="210" y1="131" x2="260" y2="104" stroke="#333" marker-end="url(#ar)"/>
  <line x1="350" y1="137" x2="350" y2="183" stroke="#2a78d6" stroke-width="2" marker-end="url(#ar)"/>
  <text x="356" y="166" font-size="10" fill="#2a78d6">routine acts (0 tokens)</text>
  <line x1="438" y1="91" x2="488" y2="91" stroke="#eb6834" stroke-width="2" marker-end="url(#ar)"/>
  <text x="440" y="83" font-size="9.5" fill="#eb6834">hand-back</text>
  <path d="M590,137 L590,207 L440,207" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#ar)"/>
  <text x="596" y="170" font-size="10" fill="#eb6834">LLM acts</text>
  <path d="M640,45 L640,10 L110,10 L110,18" fill="none" stroke="#555" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="380" y="7" text-anchor="middle" font-size="9.5" fill="#555">after each run: successes verified by replay and compiled into the library</text>
</svg></div></body></html>
